<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPS — MARKUS KETTNER</title>

    <!-- Favicons (rendered from the resting MK logo, transparent) -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kettner.berlin/apps.html">
    <meta property="og:title" content="APPS — MARKUS KETTNER">
    <meta property="og:description" content="Apps by Markus Kettner">
    <meta property="og:image" content="https://kettner.berlin/kettner.berlin_1200x630.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://kettner.berlin/apps.html">
    <meta name="twitter:title" content="APPS — MARKUS KETTNER">
    <meta name="twitter:description" content="Apps by Markus Kettner">
    <meta name="twitter:image" content="https://kettner.berlin/kettner.berlin_1200x630.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 3rem 20px 4rem;
            box-sizing: border-box;
            font-family: "Jost", sans-serif;
            font-weight: 500;
        }

        /* Back-to-home wordmark — small echo of the index name link */
        .home-link {
            font-size: clamp(1rem, 3.5vw, 1.6rem);
            text-transform: uppercase;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.2em;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            margin-bottom: 3rem;
        }

        .word {
            display: flex;
            justify-content: center;
            gap: 0.03em;
            white-space: nowrap;
        }

        .letter:not(:first-child) {
            margin-left: -0.05em;
        }

        .letter {
            display: inline-block;
            color: #fff;
            transform-style: preserve-3d;
            transform: perspective(400px) rotateY(45deg);
            filter: drop-shadow(-0.15em 0.04em 0.12em rgba(0, 0, 0, 1)) brightness(100%);
            transition: transform 2s ease-in-out, filter 2s ease-in-out, color 2s ease-in-out, margin-left 2s ease-in-out;
        }

        .letter.starting {
            transform: perspective(400px) rotateY(0deg);
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
        }

        .home-link:hover .letter {
            transform: perspective(400px) rotateY(0deg);
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
            color: #000;
        }

        /* App showcase column */
        .apps {
            display: flex;
            flex-direction: column;
            gap: 3.5rem;
            width: 100%;
            max-width: 640px;
        }

        /* The whole card (image + caption) tilts as a single plane, so the
           text shares the image's perspective and distorts as if attached to
           it. Even cards mirror the tilt via --tilt. Flattens on hover/intro. */
        .app-card {
            display: block;
            text-decoration: none;
            color: inherit;
            transform: perspective(1200px) rotateY(var(--tilt, 20deg));
            transition: transform 2s ease-in-out;
        }

        .app-card:nth-child(even) {
            --tilt: -20deg;
        }

        .app-card.starting,
        .app-card:hover {
            transform: perspective(1200px) rotateY(0deg);
        }

        /* Share image — carries the drop-shadow; the caption stays shadow-free. */
        .app-card .shot {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(-0.12em 0.04em 0.14em rgba(0, 0, 0, 0.85)) brightness(100%);
            transition: filter 2s ease-in-out;
        }

        .app-card.starting .shot,
        .app-card:hover .shot {
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
        }

        /* Caption — flat text painted onto the tilted card plane (no shadow). */
        .app-name {
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 1rem 0 0.3rem;
            color: #000;
        }

        .app-desc {
            font-size: 0.95rem;
            line-height: 1.45;
            color: #555;
            margin: 0;
            max-width: 36em;
        }

        .app-card:nth-child(even) .app-name {
            text-align: right;
        }

        .app-card:nth-child(even) .app-desc {
            text-align: right;
            margin-left: auto;
        }

        @media (max-width: 700px) {
            .apps {
                gap: 2.5rem;
            }
        }

        /* Dark mode - inverted colors */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000;
            }

            .letter {
                color: #fff;
                filter: drop-shadow(-0.5em 0.04em 0.12em rgba(0, 0, 0, 1)) brightness(100%);
            }

            .letter.starting {
                color: #000;
                filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
            }

            .home-link:hover .letter {
                filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
                color: #fff;
            }

            .app-card .shot {
                filter: drop-shadow(-0.12em 0.04em 0.14em rgba(0, 0, 0, 1)) brightness(100%);
            }

            .app-card.starting .shot,
            .app-card:hover .shot {
                filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
            }

            .app-name {
                color: #fff;
            }

            .app-desc {
                color: #aaa;
            }
        }
    </style>
</head>

<body>

    <a href="/" class="home-link" aria-label="Markus Kettner — home">
        <div class="word">
            <span class="letter starting">M</span>
            <span class="letter starting">A</span>
            <span class="letter starting">R</span>
            <span class="letter starting">K</span>
            <span class="letter starting">U</span>
            <span class="letter starting">S</span>
        </div>
        <div class="word">
            <span class="letter starting">K</span>
            <span class="letter starting">E</span>
            <span class="letter starting">T</span>
            <span class="letter starting">T</span>
            <span class="letter starting">N</span>
            <span class="letter starting">E</span>
            <span class="letter starting">R</span>
        </div>
    </a>

    <div class="apps" id="apps"></div>

    <script>
        // Add a new app by appending one entry here.
        // href keeps each subdomain's working scheme; img is always https to
        // avoid mixed-content blocking on this https page.
        const apps = [
            {
                name: 'Radius',
                href: 'https://radius.kettner.berlin/',
                img: 'https://radius.kettner.berlin/train-bike_1200x630.png',
                desc: 'Find cycle routes home from a train station outside Berlin.'
            },
            {
                name: 'Personal Bests',
                href: 'http://pb.kettner.berlin/',
                img: 'https://pb.kettner.berlin/personal_bests_1200x630.png',
                desc: 'Discover your fastest efforts hidden in your workouts.'
            },
            {
                name: 'Ditto',
                href: 'http://ditto.kettner.berlin/',
                img: 'https://ditto.kettner.berlin/ditto_1200x630.png',
                desc: 'Copy date & location onto edited or AI-made photos.'
            },
            {
                name: 'Pictimer',
                href: 'https://pictimer.kettner.berlin/',
                img: 'https://pictimer.kettner.berlin/assets/pictimer_1200x630.jpg',
                desc: "Rebuild your photos' lost timestamps, on-device."
            }
        ];

        const container = document.getElementById('apps');
        apps.forEach(app => {
            const card = document.createElement('a');
            card.className = 'app-card starting';
            card.href = app.href;
            card.target = '_blank';
            card.rel = 'noopener';
            card.setAttribute('aria-label', app.name);

            const img = document.createElement('img');
            img.className = 'shot';
            img.src = app.img;
            img.loading = 'lazy';
            img.alt = app.name + ' — share image';

            const name = document.createElement('h2');
            name.className = 'app-name';
            name.textContent = app.name;

            const desc = document.createElement('p');
            desc.className = 'app-desc';
            desc.textContent = app.desc;

            card.append(img, name, desc);
            container.appendChild(card);
        });

        // Trigger the intro transition out of the 'starting' state.
        setTimeout(() => {
            document.querySelectorAll('.letter, .app-card').forEach(el => {
                el.classList.remove('starting');
            });
        }, 100);
    </script>

</body>

</html>
