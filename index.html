<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: "Jost", sans-serif;
            font-weight: 500;
            overflow: hidden;
        }

        .stage {
            /* Responsive font size: min 2rem, preferred 10vw, max 8rem */
            font-size: clamp(2rem, 10vw, 8rem);
            text-transform: uppercase;
            display: flex;
            flex-direction: row;
            /* Single line on desktop */
            align-items: center;
            gap: 0.2em;
        }

        .word {
            display: flex;
            justify-content: center;
            gap: 0.03em;
            white-space: nowrap;
        }

        .letter {
            display: inline-block;
            color: #000;
            /* Black text on white - visible when flat */
            transform-style: preserve-3d;

            /* Resting state: 45° rotation with shadow */
            /* perspective() per letter gives each its own vanishing point */
            transform: perspective(400px) rotateY(45deg);
            filter: drop-shadow(-0.15em 0.04em 0.12em rgba(0, 0, 0, 1)) brightness(100%);

            /* Smooth transition for hover interaction */
            transition: transform 2s ease-in-out, filter 2s ease-in-out;
        }

        /* Intro animation class - removed by JS after animation ends */
        /* iOS Safari: filter must NOT be in @keyframes - it breaks the animation */
        /* Instead, start with no shadow and let CSS transition handle it after animation ends */
        .letter.animating {
            animation: intro 2s ease-in-out forwards;
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
        }

        /* Hover on the stage to affect all letters (desktop) */
        .stage:hover .letter {
            transform: perspective(400px) rotateY(0deg);
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
        }

        /* Active state for touch devices - toggled via JavaScript */
        .stage.active .letter {
            transform: perspective(400px) rotateY(0deg);
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
        }

        @keyframes intro {
            0% {
                /* Start flat */
                transform: perspective(400px) rotateY(0deg);
            }

            100% {
                /* End at 45° */
                transform: perspective(400px) rotateY(45deg);
            }
        }

        /* Mobile: stack words vertically */
        @media (max-width: 600px) {
            .stage {
                flex-direction: column;
                gap: 0.1em;
            }
        }

        /* Dark mode - inverted colors */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000;
            }

            .letter {
                color: #fff;
                /* White text on black - visible when flat */
                filter: drop-shadow(-0.15em 0.04em 0.12em rgba(255, 255, 255, 1)) brightness(100%);
            }

            .stage:hover .letter,
            .stage.active .letter {
                filter: drop-shadow(0px 0px 0px rgba(255, 255, 255, 0)) brightness(100%);
            }

            .letter.animating {
                filter: drop-shadow(0px 0px 0px rgba(255, 255, 255, 0)) brightness(100%);
            }

            @keyframes intro {
                0% {
                    transform: perspective(400px) rotateY(0deg);
                }

                100% {
                    transform: perspective(400px) rotateY(45deg);
                }
            }
        }
    </style>
</head>

<body>

    <div class="stage">
        <div class="word">
            <span class="letter animating">M</span>
            <span class="letter animating">A</span>
            <span class="letter animating">R</span>
            <span class="letter animating">K</span>
            <span class="letter animating">U</span>
            <span class="letter animating">S</span>
        </div>
        <div class="word">
            <span class="letter animating">K</span>
            <span class="letter animating">E</span>
            <span class="letter animating">T</span>
            <span class="letter animating">T</span>
            <span class="letter animating">N</span>
            <span class="letter animating">E</span>
            <span class="letter animating">R</span>
        </div>
    </div>

    <script>
        // Remove the animating class after intro completes to enable smooth transitions
        document.querySelectorAll('.letter').forEach(letter => {
            letter.addEventListener('animationend', () => {
                letter.classList.remove('animating');
            });
        });

        // Touch device support: tap to toggle the "active" state
        const stage = document.querySelector('.stage');
        let isTouchDevice = false;

        // Detect touch device
        stage.addEventListener('touchstart', () => {
            isTouchDevice = true;
        }, { once: true });

        // Toggle active state on click (works for both touch and mouse)
        stage.addEventListener('click', (e) => {
            // Only toggle on touch devices to avoid interfering with hover on desktop
            if (isTouchDevice) {
                stage.classList.toggle('active');
            }
        });
    </script>

</body>

</html>
