<!DOCTYPE html>
<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Jost", sans-serif;
            font-weight: 500;
            overflow: hidden;
        }

        .stage {
            font-size: 8rem;
            text-transform: uppercase;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            /* Slight gap helps the 3D rotation feel distinct */
        }

        .letter {
            display: inline-block;
            color: #fff;
            transform-style: preserve-3d;

            /* Resting state: 45° rotation with shadow */
            /* perspective() per letter gives each its own vanishing point */
            transform: perspective(400px) rotateY(45deg);
            filter: drop-shadow(-20px 5px 15px rgba(0, 0, 0, 1)) brightness(100%);

            /* Smooth transition for hover interaction */
            transition: transform 2s ease-in-out, filter 2s ease-in-out;
        }

        /* Intro animation class - removed by JS after animation ends */
        .letter.animating {
            animation: intro 2s ease-in-out forwards;
        }

        /* Hover on the stage to affect all letters */
        .stage:hover .letter {
            transform: perspective(400px) rotateY(0deg);
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
        }

        @keyframes intro {
            0% {
                /* Start flat */
                transform: perspective(400px) rotateY(0deg);
                filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)) brightness(100%);
            }

            100% {
                /* End at 45° */
                transform: perspective(400px) rotateY(45deg);
                filter: drop-shadow(-20px 5px 15px rgba(0, 0, 0, 1)) brightness(100%);
            }
        }

        /* Dark mode - inverted colors */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000;
            }

            .letter {
                color: #000;
                filter: drop-shadow(-20px 5px 15px rgba(255, 255, 255, 1)) brightness(100%);
            }

            .stage:hover .letter {
                filter: drop-shadow(0px 0px 0px rgba(255, 255, 255, 0)) brightness(100%);
            }

            @keyframes intro {
                0% {
                    transform: perspective(400px) rotateY(0deg);
                    filter: drop-shadow(0px 0px 0px rgba(255, 255, 255, 0)) brightness(100%);
                }

                100% {
                    transform: perspective(400px) rotateY(45deg);
                    filter: drop-shadow(-20px 5px 15px rgba(255, 255, 255, 1)) brightness(100%);
                }
            }
        }
    </style>
</head>

<body>

    <div class="stage">
        <span class="letter animating" style="--i:1">M</span>
        <span class="letter animating" style="--i:2">A</span>
        <span class="letter animating" style="--i:3">R</span>
        <span class="letter animating" style="--i:4">K</span>
        <span class="letter animating" style="--i:5">U</span>
        <span class="letter animating" style="--i:6">S</span>
        <span class="letter animating" style="--i:7">&nbsp;</span>
        <span class="letter animating" style="--i:8">K</span>
        <span class="letter animating" style="--i:9">E</span>
        <span class="letter animating" style="--i:10">T</span>
        <span class="letter animating" style="--i:11">T</span>
        <span class="letter animating" style="--i:12">N</span>
        <span class="letter animating" style="--i:13">E</span>
        <span class="letter animating" style="--i:14">R</span>
    </div>

    <script>
        // Remove the animating class after intro completes to enable smooth transitions
        document.querySelectorAll('.letter').forEach(letter => {
            letter.addEventListener('animationend', () => {
                letter.classList.remove('animating');
            });
        });
    </script>

</body>

</html>
